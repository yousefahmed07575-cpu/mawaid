name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout our code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Create Flutter project
        run: flutter create --org com.yousef --project-name mawaid temp_project

      - name: Update minSdkVersion to 23
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' temp_project/android/app/build.gradle

      - name: Upgrade Kotlin version
        run: |
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/' temp_project/android/build.gradle
          if ! grep -q 'ext.kotlin_version' temp_project/android/build.gradle; then
            sed -i 's/^buildscript {/buildscript {\n    ext.kotlin_version = "1.9.22"/' temp_project/android/build.gradle
          fi

      - name: Add permissions to AndroidManifest
        run: |
          MANIFEST="temp_project/android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <application|' $MANIFEST

      - name: Add notification icon
        run: |
          mkdir -p temp_project/android/app/src/main/res/drawable
          if [ -f assets/notification_icon.png ]; then
            cp assets/notification_icon.png temp_project/android/app/src/main/res/drawable/notification_icon.png
          else
            echo "⚠️ notification_icon.png not found, using default"
          fi

      - name: Copy our custom code
        run: |
          cp lib/main.dart temp_project/lib/main.dart
          cp pubspec.yaml temp_project/pubspec.yaml
          if [ -d assets ]; then
            mkdir -p temp_project/assets
            cp -r assets/* temp_project/assets/ 2>/dev/null || true
          fi

      - name: Get dependencies
        run: cd temp_project && flutter pub get

      - name: Build APK
        run: cd temp_project && flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mawaid-apk
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk